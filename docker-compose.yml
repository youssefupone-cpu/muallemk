services:
  backend:
    build: ./backend
    container_name: muallemk-backend
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATA_DIR=/app/data
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - HOST=0.0.0.0
      # مفاتيح API اختيارية — مرّرها عبر متغيرات البيئة لا عبر env_file كامل
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - muallemk-data:/app/data
    restart: unless-stopped
    depends_on:
      - ollama
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"

  frontend:
    build: ./frontend
    container_name: muallemk-frontend
    ports:
      - "${FRONTEND_PORT:-3002}:80"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"

  ollama:
    image: ollama/ollama:0.3.12
    container_name: muallemk-ollama
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "2.0"
        reservations:
          memory: 2G
          cpus: "1.0"

volumes:
  muallemk-data:
  ollama-models:
