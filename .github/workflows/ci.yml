name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت tesseract (خط الاستخراج والـ OCR)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ara

      - name: تثبيت التبعيات
        run: pip install -e "./backend[dev]"

      - name: تدقيق (ruff)
        working-directory: backend
        run: ruff check .

      - name: تنسيق (ruff format)
        working-directory: backend
        run: ruff format --check .

      - name: اختبارات
        working-directory: backend
        run: python -m pytest -q

      - name: فحص الثغرات (pip-audit)
        working-directory: backend
        run: pip install pip-audit && pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: تدقيق (oxlint)
        run: npm run lint

      - name: تنسيق (prettier)
        run: npx prettier --check src

      - name: نوعيات (tsc)
        run: npx tsc -b --noEmit

      - name: بناء (vite)
        run: npm run build

      - name: اختبارات الواجهة (Vitest)
        run: npm run test

      - name: فحص الأمان (npm audit)
        run: npm audit --audit-level high

      - name: E2E (Playwright)
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: microsoft/playwright-github-action@v1
        with:
          args: --project chromium
        working-directory: frontend

  docker-build:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: إعداد Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: فحص إعداد compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: بناء صورة الخلفية
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: muallemk-backend:sha-${{ github.sha }}

      - name: بناء صورة الواجهة الأمامية
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: muallemk-frontend:sha-${{ github.sha }}

      - name: Smoke test — صحة الصور
        run: |
          docker run --rm muallemk-backend:sha-${{ github.sha }} python -c "import app.main; print('backend OK')"
          docker run --rm --entrypoint="" muallemk-frontend:sha-${{ github.sha }} ls -la /usr/share/nginx/html

